[project]
name = "lidar-mcp"
version = "0.1.0"
description = "MCP server for YDLIDAR USB LiDAR sensors (X2/X4/G1/G4/S series) — scan, stream, status"
authors = [{ name = "Sandra Schipal", email = "sandra@example.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2,<4",
    "pyserial>=3.5,<4",
    "prefab-ui>=0.14.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lidar_mcp"]
