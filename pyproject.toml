[project]
name = "lidar-mcp"
version = "0.2.0"
description = "MCP server for YDLIDAR USB LiDAR sensors (X2/X4/G1/G4/S series) — scan, stream, status"
authors = [{ name = "Sandra Schipal", email = "sandraschipal@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "pyserial>=3.5,<4",
    "prefab-ui>=0.14.0",
]

[dependency-groups]
dev = ["ruff>=0.16.0,<0.17", "pytest>=8.0", "pytest-cov>=6.0", "pytest-asyncio>=0.24"]

[project.scripts]
lidar-mcp = "lidar_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lidar_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "T20"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--cov=lidar_mcp", "--cov-report=term-missing", "--cov-fail-under=70"]
